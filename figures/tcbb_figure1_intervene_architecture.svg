<text x="772" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5d6670" text-anchor="start">Biology-guided sparse</text>
<text x="772" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5d6670" text-anchor="start">edges stabilize</text>
<text x="772" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5d6670" text-anchor="start">interpretable module</text>
<text x="772" y="239" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5d6670" text-anchor="start">couplings.</text>
