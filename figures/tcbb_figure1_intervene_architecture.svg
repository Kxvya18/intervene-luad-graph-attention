<text x="1010" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5d6670" text-anchor="start">Relapse risk, stable</text>
<text x="1010" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5d6670" text-anchor="start">module edges and gene-</text>
