<text x="296" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5d6670" text-anchor="start">Proteostasis, redox,</text>
<text x="296" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5d6670" text-anchor="start">mitochondrial</text>
<text x="296" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5d6670" text-anchor="start">translation,</text>
<text x="296" y="239" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5d6670" text-anchor="start">apoptosis/IAP,</text>
<text x="296" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5d6670" text-anchor="start">SREBP/lipid and</text>
<text x="296" y="273" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5d6670" text-anchor="start">AKT/mTOR become tokens.</text>
