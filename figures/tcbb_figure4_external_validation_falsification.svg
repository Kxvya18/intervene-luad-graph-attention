<text x="82" y="620" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1b1b1b" text-anchor="start">Takeaway: GSE30219 supports MRPL21/refined stress-survival scores, GSE37745 is weak, and GSE68465 mainly shows</text>
