<rect x="518" y="130" width="190" height="145" rx="6" fill="#fbfcfe" stroke="#6f5aa7" stroke-width="1.5"/>
<text x="534" y="160" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#6f5aa7" text-anchor="start">Interleaved attention</text>
<text x="534" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5d6670" text-anchor="start">Pseudo-heads mix module</text>
<text x="534" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5d6670" text-anchor="start">information before</text>
<text x="534" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5d6670" text-anchor="start">survival prediction.</text>
