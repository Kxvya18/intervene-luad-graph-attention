<text x="42" y="350" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1b1b1b" text-anchor="start">Special case: if attention mixing is</text>
<text x="42" y="371" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1b1b1b" text-anchor="start">identity and graph sparsity is zero,</text>
<text x="42" y="392" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1b1b1b" text-anchor="start">INTERVENE reduces to a raw</text>
<text x="42" y="413" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1b1b1b" text-anchor="start">thermodynamic/module score. With sparse</text>
<text x="42" y="434" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1b1b1b" text-anchor="start">interleaving, it learns cross-module</text>
<text x="42" y="455" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1b1b1b" text-anchor="start">interaction terms.</text>
<text x="994" y="350" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1b1b1b" text-anchor="start">Primary use in this project: discover</text>
<text x="994" y="371" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1b1b1b" text-anchor="start">relapse-associated stress-survival</text>
<text x="994" y="392" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1b1b1b" text-anchor="start">structure, then extract a compact</text>
<text x="994" y="413" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1b1b1b" text-anchor="start">MRPL21/proteasome/redox gene axis for</text>
<text x="994" y="434" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#1b1b1b" text-anchor="start">external testing.</text>
