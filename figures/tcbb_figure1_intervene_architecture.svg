<text x="1010" y="239" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5d6670" text-anchor="start">extracted for</text>
<text x="1010" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5d6670" text-anchor="start">validation.</text>
<text x="518" y="340" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1b1b1b" text-anchor="start">Interleaved pseudo-head mixing</text>
<text x="440" y="400" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5d6670" text-anchor="start">head 1</text>
