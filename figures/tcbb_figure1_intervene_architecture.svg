<text x="42" y="48" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#1b1b1b" text-anchor="start">Figure 1. INTERVENE architecture</text>
<text x="42" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" fill="#5d6670" text-anchor="start">IHA-inspired interleaved head mixing is adapted from language tokens to biological module tokens.</text>
<rect x="42" y="130" width="190" height="145" rx="6" fill="#fbfcfe" stroke="#2f6db3" stroke-width="1.5"/>
<text x="58" y="160" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#2f6db3" text-anchor="start">Thermodynamic prior</text>
<text x="58" y="188" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5d6670" text-anchor="start">DepMap dependency,</text>
<text x="58" y="205" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5d6670" text-anchor="start">expression, CN and</text>
<text x="58" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5d6670" text-anchor="start">PRISM define stress-</text>
<text x="58" y="239" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5d6670" text-anchor="start">survival module</text>
<text x="58" y="256" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#5d6670" text-anchor="start">pressure.</text>
